<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Accc — 测试工程师 · 自动化测试 · AI 测试</title>
  <desc id="heroDesc">个人主页标题：把测试经验做成能直接用的工具与课程。右侧是一条从需求到报告的测试流水线，末端标记 PASS。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#30363d" stroke-width="1"/>
  <rect x="600" y="0" width="600" height="380" fill="url(#grid)" opacity="0.9"/>

  <!-- left: identity -->
  <g id="identity" transform="translate(60 62)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="142" height="32" rx="8" fill="#1f6feb" fill-opacity="0.16" stroke="#388bfd" stroke-opacity="0.45"/>
      <circle cx="19" cy="16" r="5" fill="#3fb950"/>
      <text x="32" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#79c0ff">QA / TEST ENGINEER</text>
    </g>

    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="700" fill="#f0f6fc">Hi, I'm Accc</text>

    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#c9d1d9">把测试经验，做成能直接用的工具与课程。</text>

    <g transform="translate(0 192)">
      <rect x="0" y="0" width="452" height="58" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="20" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">FOCUS</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#e6edf3">自动化测试 · AI 测试 · 质量工程</text>
    </g>
  </g>

  <!-- right: native material - test pipeline -->
  <g id="pipeline" transform="translate(628 58)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">FROM REQUIREMENT TO REPORT</text>

    <g transform="translate(0 40)">
      <path d="M26 22 H514" stroke="url(#line)" stroke-width="2" stroke-opacity="0.7"/>

      <g transform="translate(0 0)">
        <circle cx="26" cy="22" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
        <circle cx="26" cy="22" r="4" fill="#3fb950"/>
        <text x="26" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">需求</text>
      </g>
      <g transform="translate(122 0)">
        <circle cx="26" cy="22" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
        <circle cx="26" cy="22" r="4" fill="#3fb950"/>
        <text x="26" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">用例</text>
      </g>
      <g transform="translate(244 0)">
        <circle cx="26" cy="22" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
        <circle cx="26" cy="22" r="4" fill="#3fb950"/>
        <text x="26" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">脚本</text>
      </g>
      <g transform="translate(366 0)">
        <circle cx="26" cy="22" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
        <circle cx="26" cy="22" r="4" fill="#3fb950"/>
        <text x="26" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">执行</text>
      </g>
      <g transform="translate(488 0)">
        <circle cx="26" cy="22" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
        <circle cx="26" cy="22" r="4" fill="#3fb950"/>
        <text x="26" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">报告</text>
      </g>
    </g>

    <!-- factual counters -->
    <g transform="translate(0 122)">
      <rect x="0" y="0" width="164" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#79c0ff">PROJECTS</text>
      <text x="16" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#f0f6fc">6</text>

      <rect x="178" y="0" width="164" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="194" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#79c0ff">NOTES</text>
      <text x="194" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#f0f6fc">32</text>

      <rect x="356" y="0" width="160" height="80" rx="10" fill="#12261a" stroke="#2ea043"/>
      <text x="372" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#56d364">STATUS</text>
      <text x="372" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#56d364">PASS ✓</text>
    </g>

    <g transform="translate(0 228)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">7 PUBLIC REPOS · TEST DEVELOPMENT</text>
    </g>
  </g>
</svg>
